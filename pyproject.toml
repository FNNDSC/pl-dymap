[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dymap"
dynamic = ["version"]
description = "Map a ChRIS pipeline over the directories of an input: one workflow per item, a ChRIS DS plugin"
readme = "README.rst"
license = { text = "MIT" }
# chris_plugin_info reads the legacy Author, Author-email and Home-page metadata
# fields, which the [project] table does not emit; setup.cfg supplies them, and the
# author name lives there alone so Author-email stays a bare address.
authors = [{ email = "dev@babyMRI.org" }]
requires-python = ">=3.11"
dependencies = ["chris_plugin>=0.4.0", "pftree>=4.1.1", "pflog>=2.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/pl-dymap"

[project.scripts]
dymap = "dymap.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hostlib>=1.2.0"]

[tool.setuptools.packages.find]
include = ["dymap*"]

[tool.setuptools.dynamic]
version = { attr = "dymap.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
